{% extends 'base.html' %}

{% block content %}
<div>
    <p>Has solicitado el factorial de: <strong>{{ numero }}</strong></p>
    
    <div class="result {% if 'Error' in resultado|string %}error{% endif %}">
        <p>{{ numero }}! = {{ resultado }}</p>
    </div>
    
    <p><a href="/">Volver a la página principal</a></p>
</div>
{% endblock %}
